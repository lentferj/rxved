#
# rxved's quality checks as pre-commit hooks. `make check` runs the same
# tools over the whole tree; these run the fast ones over what you changed.
#
# Install:  pre-commit install
# By hand:  .venv/bin/pre-commit run --all-files
#
# Hook revisions are pinned to the exact versions in
# pyproject.toml's [project.optional-dependencies].dev, so a hook and
# `make check` can never disagree about what a finding is. Upgrading a tool
# means upgrading both in the same commit.

minimum_pre_commit_version: "3.0.0"
default_language_version:
  python: python3.11

repos:
  # --- ruff: lint and format ----------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      # Runs first, so a fixable lint is reported rather than being
      # silently reformatted around.
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # --- mypy ----------------------------------------------------------------
  # A LOCAL hook, not mirrors-mypy. That one runs mypy in an isolated
  # virtualenv built from `additional_dependencies`, and vinsynlib cannot be
  # named there: it is a sibling checkout, not a package on an index, so
  # there is nothing to install and no version to pin. In an environment
  # without it every `from vinsynlib...` resolved to Any, which turned the
  # strict checks this project holds itself to into 15 errors about the
  # imports rather than about the code -- and would have hidden a real
  # error behind them on every commit after this one.
  #
  # Running the project's own .venv is both correct and the same
  # interpreter the rest of the gate uses, so a hook and `make typecheck`
  # cannot disagree -- which was the reason this was a mirrors hook.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: .venv/bin/python -m mypy
        language: system
        types: [python]
        pass_filenames: false
        args: [--strict, --no-error-summary, rxved, xv, tools]

  # --- secrets -------------------------------------------------------------
  # Fails on anything new since .secrets.baseline. To adopt a finding as
  # intentional, run `make baseline` and commit the regenerated file.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]

  # --- shell ---------------------------------------------------------------
  # rxved has no shell scripts today (Makefile targets call the tools
  # directly), so these two match nothing yet. They are here so that the
  # first *.sh that lands is checked from the start rather than after
  # somebody remembers. Both are apt-installed on the dev host; the hooks
  # use their own pinned copies.
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        args: [--severity=style]
  # rev is the newest that still declares the legacy `commit` stage rather
  # than `pre-commit`. From v3.11.0-1 the manifest uses the newer stage
  # names and pre-commit refuses to load it (InvalidManifestError), which
  # fails the whole config, not just this hook. Raise this when pre-commit
  # itself goes past 3.3.
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.10.0-1
    hooks:
      - id: shfmt
        args: [-i, "2", -ci, -w]