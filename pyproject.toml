[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rxved"
version = "0.1.0"
description = "Terminal browser for the Roland XV-2020 synthesizer over MIDI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "Jan Lentfer", email = "jan.lentfer@web.de" }]
keywords = ["midi", "sysex", "synthesizer", "roland", "xv-2020", "srx", "tui"]
# No "License :: OSI Approved :: ..." classifier: the `license` field above
# already carries the SPDX expression, and PEP 639 deprecates stating it twice.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: System :: Hardware",
]
dependencies = [
    "textual>=0.80",
    "python-rtmidi>=1.5",
]

[project.urls]
Homepage = "https://github.com/lentferj/rxved"
Source = "https://github.com/lentferj/rxved"
Issues = "https://github.com/lentferj/rxved/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23"]

[project.scripts]
rxved = "rxved.app:main"
rxvcli = "rxved.cli:main"

[tool.setuptools]
packages = ["xv", "rxved"]
# Explicit rather than relying on setuptools' default glob: GPL-2 section 1
# requires the licence text to travel with the program, so COPYING must never
# silently drop out of a built distribution.
license-files = ["LICENSE", "COPYING"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
