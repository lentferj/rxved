#
# rxved's checks on all three platforms the README claims support for.
# The matrix is deliberately the platforms rather than the Python
# versions: this program talks to a MIDI port, so where it runs matters
# more than which interpreter it runs under.

name: checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least privilege. Nothing here needs to write to the repository.
permissions:
  contents: read

# A new push supersedes the run it replaces.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One broken platform should not hide the others' results.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.11 is the floor in pyproject.toml and 3.12 is the next one up.
        # 3.13 is deliberately absent from both: python-rtmidi publishes
        # wheels for cp38-cp312 only, so `pip install` there falls back to a
        # source build needing ALSA headers (Linux), Xcode CLT (macOS) and a
        # C toolchain (Windows). The classifier is not claimed either --
        # see the note in pyproject.toml and docs/CHECKS.md.
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      # The shared library, as a SIBLING of this checkout -- not a
      # subdirectory. `vinsynlib` is a path dependency (see
      # [tool.uv.sources] in pyproject.toml) and is not on an index, so
      # `pip install -e .` cannot resolve it from PyPI; it is installed from
      # this checkout in the step below. Keeping it beside this repository
      # rather than inside it keeps the path dependency honest: a copy under
      # the tree would let an edit to the library reach this project's CI
      # without ever being committed here.
      #
      # `git clone`, not `actions/checkout`: that action refuses a `path`
      # outside $GITHUB_WORKSPACE ("Repository path ... is not under ..."),
      # and a sibling is exactly that. vinsynlib is public, so no token is
      # needed.
      - name: Clone the shared library beside this checkout
        shell: bash
        run: |
          git clone --depth 1 https://github.com/lentferj/vinsynlib.git ../vinsynlib

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # GitHub's Windows images do not ship GNU make, and `make check` is
      # the one entry point CI and developers share. SHELL is pointed at
      # Git Bash because the recipes in the Makefile are POSIX sh, not
      # cmd.exe -- the audit-secrets target in particular uses `trap`.
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y

      - name: Point make at a POSIX shell (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "SHELL=C:/Program Files/Git/usr/bin/bash.exe" >> "$GITHUB_ENV"
          make --version

      # A clean venv, not the --system-site-packages one the README
      # recommends. python-rtmidi ships wheels for all three platforms
      # here, so nothing needs to be borrowed from the host.
      - name: Create the virtualenv
        run: python -m venv .venv

      # shell: bash explicitly -- the default is PowerShell on Windows and
      # would not understand the `[ -x ... ]` test below.
      - name: Install rxved and the checks
        shell: bash
        run: |
          if [ -x .venv/Scripts/python.exe ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          # Upgrade pip and setuptools before anything else. A venv seeded
          # from an older interpreter carries older copies of both, and
          # pip-audit audits the whole venv -- so without this the audit
          # reports the packaging tools' own advisories rather than
          # anything about rxved. This is the CI counterpart of the
          # conditional ignores in the Makefile: CI upgrades instead of
          # suppressing, and suppresses nothing.
          "$PY" -m pip install --upgrade pip setuptools
          # vinsynlib is a sibling checkout, not a package on an index, so
          # `pip install -e .` cannot take it from PyPI. Installing it from
          # the checkout above satisfies the dependency; both this line and
          # that checkout go away when the library is published.
          "$PY" -m pip install --no-deps -e ../vinsynlib
          # `tools` as well as `dev`: tools/read_marked_list.py needs numpy
          # and Pillow, and its test and mypy check are part of `make check`.
          "$PY" -m pip install -e '.[dev,tools]'

      # The whole pipeline, exactly as a developer runs it locally.
      - name: make check
        shell: bash
        run: make check

  # The hooks are a separate promise from the pipeline: a change to
  # .pre-commit-config.yaml can break commits on every platform while
  # `make check` stays green.
  pre-commit:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      # The mypy hook is a local one that runs the project's own .venv (see
      # .pre-commit-config.yaml, and the comment there on why it is not a
      # mirrors hook): vinsynlib cannot be named in an isolated hook
      # environment, so the venv has to exist before the hooks run. The same
      # sibling clone the matrix job uses.
      - name: Clone the shared library beside this checkout
        shell: bash
        run: |
          git clone --depth 1 https://github.com/lentferj/vinsynlib.git ../vinsynlib

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Create the virtualenv the mypy hook runs in
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip setuptools
          .venv/bin/python -m pip install --no-deps -e ../vinsynlib
          .venv/bin/python -m pip install -e '.[dev,tools]'

      # `pre-commit autoupdate` is deliberately not run here. It rewrites
      # the pinned revisions, and a hook that upgrades itself between the
      # commit that pins it and the next run of that commit is not pinned.
      - name: Run every hook over every file
        uses: pre-commit/action@v3.0.1